#################### default parameters ############################
# favicon module: https://github.com/gethugothemes/hugo-modules/tree/master/images#favicon-implementation
favicon = "images/favicon.png"
# logo module: https://github.com/gethugothemes/hugo-modules/tree/master/images#logo-implementation
logo = ""
logo_darkmode = ""
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "200px"
logo_height = "40px"
# if logo_webp set false, will not generate WEBP version of logo | default is true
logo_webp = true
# logo text will only show when logo is missing.
logo_text = "Refurbished Dinosaurs"
# navbar fixed to top
navbar_fixed = true
# theme-mode
theme_switcher = true
theme_default = "dark" # available options [light/dark/system]
# Main Sections
mainSections = ["blog"]
# contact form action
contact_form_action = "#" # contact form works with [https://airform.io/] or [https://formspree.io]
# google tag manager, see https://developers.google.com/tag-manager/
google_tag_manager = "" # example: G-XXXXXXXXXX
google_adsense = ""     # example: ca-pub-xxxxxxxxxxxxxxxx
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
custom_script = ""
# copyright
copyright = "Refurbished Dinosaurs"

# Preloader
# preloader module: https://github.com/gethugothemes/hugo-modules/tree/master/components/preloader
[preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Navigation button
[navigation_button]
enable = false
label = ""
link = ""

# search
# search module: https://github.com/gethugothemes/hugo-modules/tree/master/search
[search]
enable = true
primary_color = "#e8913a"
include_sections = ["blog", "games"]
show_image = true
show_description = true
show_tags = true
show_categories = true

# announcement
# announcement module: https://github.com/gethugothemes/hugo-modules/tree/master/components/announcement
[announcement]
enable = false
expire_days = 7
content = ""

# seo meta data for OpenGraph / Twitter Card
# seo module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/basic-seo
[metadata]
keywords = [
  "game restoration",
  "abandonware",
  "retro games",
  "source ports",
  "Chaos Overlords",
]
description = "Bringing obscure old games back from extinction: faithful, playable restorations of forgotten strategy classics."
author = "Refurbished Dinosaurs"
twitter = ""
image = "images/og-image.png"


# site verifications
# verification module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications
[site_verification]
google = ""   # Your verification code
bing = ""     # Your verification code
baidu = ""    # Your verification code
facebook = "" # Your verification code
mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
[cookies]
enable = false
expire_days = 60
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]


############################ Contacts ############################
[contact]
email = "info@refurbished-dinosaurs.org"
github = "https://github.com/kibertoad/refurbished-dinosaurs"


########################## Subscription ##########################
# Mailing list for release announcements, handled by Twilio SendGrid
# Marketing Campaigns. Two ways to wire it up, pick one:
#
#   "sendgrid_form" - paste the URL of a SendGrid-hosted signup form
#                     (Marketing > Signup Forms > Actions > Share Code).
#                     SendGrid owns the double opt-in confirmation mail,
#                     the contact list and the unsubscribe page. No backend.
#
#   "endpoint"      - post to your own endpoint, which holds the API key and
#                     calls the SendGrid Marketing Contacts API. A ready-made
#                     Cloudflare Worker lives in ../workers/subscribe.
#
# See ../README.md ("Mailing list") for the trade-offs.
[subscription]
enable = true
provider = "sendgrid_form"
title = "Get told when a dinosaur wakes up"
content = "A few emails a year: new restorations, playable releases, nothing else. Unsubscribe link in every message."
# provider = "sendgrid_form"
form_url = ""
form_height = "460px"
# provider = "endpoint"
endpoint = ""
placeholder = "you@example.com"
button_label = "Subscribe"
note = "Double opt-in. We store your address in SendGrid and use it for release announcements only."
