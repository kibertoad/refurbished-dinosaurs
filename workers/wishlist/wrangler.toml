name = "refurbished-dinosaurs-wishlist"
main = "src/worker.ts"
# The tests run on the workerd binary that ships with the Vitest pool, and a
# date newer than that binary supports refuses to start. Bump it and the pool
# together.
compatibility_date = "2026-08-22"

[vars]
# Which game database backs search and the entry details: "igdb" or "rawg".
GAME_DB_PROVIDER = "igdb"
ALLOWED_ORIGIN = "https://dinorefurb.com"
# Entries a board read returns, and how many votes one voter gets per day.
BOARD_LIMIT = "100"
MAX_VOTES_PER_DAY = "25"

# Created with: wrangler d1 create refurbished-dinosaurs-wishlist
# Paste the id it prints here, then apply schema.sql.
[[d1_databases]]
binding = "WISHLIST_DB"
database_name = "refurbished-dinosaurs-wishlist"
database_id = ""

# Secrets are not stored here:
#   wrangler secret put VOTER_SECRET        # any long random string
#   wrangler secret put IGDB_CLIENT_ID      # GAME_DB_PROVIDER = "igdb"
#   wrangler secret put IGDB_CLIENT_SECRET
#   wrangler secret put RAWG_API_KEY        # GAME_DB_PROVIDER = "rawg"
