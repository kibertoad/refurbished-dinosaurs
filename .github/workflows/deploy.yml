name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # pnpm's version is the `packageManager` field in the root package.json.
      - name: Enable corepack
        run: corepack enable
        working-directory: .

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: |
            /tmp/hugo_cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-${{ hashFiles('website/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Get Hugo modules
        run: hugo mod get

      # One install for the workspace. Hugo's esbuild resolves the page
      # script's imports through the linked contracts package, which pnpm
      # installs alongside the site's own dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate hugo_stats.json
        run: hugo --gc

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          NODE_ENV: production
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
