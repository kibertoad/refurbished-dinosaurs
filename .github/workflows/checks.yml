name: Checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'workers/**'
      - 'website/assets/js/**'
      - 'website/package*.json'
      - 'website/tsconfig.json'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'workers/**'
      - 'website/assets/js/**'
      - 'website/package*.json'
      - 'website/tsconfig.json'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wishlist:
    name: Contracts, worker and page script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            packages/wishlist-contracts/package-lock.json
            workers/wishlist/package-lock.json
            website/package-lock.json

      # Both consumers link this package, and its own dependencies have to be
      # installed for either of them to resolve through it.
      - name: Install shared contracts
        run: npm ci
        working-directory: ./packages/wishlist-contracts

      - name: Typecheck shared contracts
        run: npm run typecheck
        working-directory: ./packages/wishlist-contracts

      - name: Install worker
        run: npm ci
        working-directory: ./workers/wishlist

      - name: Typecheck worker
        run: npm run typecheck
        working-directory: ./workers/wishlist

      - name: Test worker
        run: npm test
        working-directory: ./workers/wishlist

      - name: Install site
        run: npm ci
        working-directory: ./website

      - name: Typecheck page script
        run: npm run typecheck
        working-directory: ./website

      # Hugo bundles this script with its own esbuild at build time; this is
      # the same bundle, so a broken import fails here rather than in a deploy.
      - name: Bundle page script
        run: npm run check:js
        working-directory: ./website
