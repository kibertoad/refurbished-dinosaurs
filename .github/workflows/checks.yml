name: Checks

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'workers/**'
      - 'website/assets/js/**'
      - 'website/scripts/**'
      - 'website/package.json'
      - 'website/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'workers/**'
      - 'website/assets/js/**'
      - 'website/scripts/**'
      - 'website/package.json'
      - 'website/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Typecheck, test and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # pnpm's version is the `packageManager` field in package.json, so it is
      # stated in one place for CI and for contributors alike.
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # turbo runs each package's typecheck, the worker's tests (inside
      # workerd, against a real D1 database) and the page-script bundle.
      - name: Check
        run: pnpm check
