name: Worker tests

on:
  push:
    branches: [main]
    paths: ['workers/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['workers/**', '.github/workflows/worker-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wishlist:
    name: workers/wishlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./workers/wishlist
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No dependencies to install: the tests run on node:test and node:sqlite.
      - name: Run tests
        run: npm test
